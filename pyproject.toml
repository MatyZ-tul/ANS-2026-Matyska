[project]
name = "ans-2026"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gdown>=6.4.1",
    "ipykernel>=7.4.0",
    "ipython>=9.17.1",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu132", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu132", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
